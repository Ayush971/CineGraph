name: Keep backend awake

# Render's free tier sleeps a service after 15 minutes of inactivity, and the
# cold start costs ~30s — which the landing page waits on before it can show
# any posters. Pinging /health keeps it warm.
#
# Note: GitHub throttles scheduled workflows on free/inactive repos, so this
# fires far less often than the cron asks for (expect roughly hourly, not every
# 10 min). That's fine — it still trims most cold starts.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          # `|| true` matters: GitHub runs this with `set -e`, so a curl timeout
          # (exit 28) would otherwise kill the step before we can report on it.
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 \
            https://cinegraph-api-48a2.onrender.com/health || true)

          if [ "$code" = "200" ]; then
            echo "Backend is awake (200)."
          elif [ "$code" = "000" ]; then
            echo "::warning::No response within 90s — the service may be crash-looping or suspended. Check Render logs."
          else
            echo "::warning::Unexpected status $code from /health."
          fi
          # Always succeed: this is a keep-warm ping, not a health gate. A red X
          # here every 10 minutes is noise, not signal.
